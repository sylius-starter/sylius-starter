canvas:
    hero:
        issue: 'Canvas — N° 01'
        season: 'Édition d’automne'
        title: 'L’art de s’habiller <em>au quotidien</em>.'
        lead: 'Des pièces discrètes, des matières honnêtes et des coupes qui durent. Une garde-robe composée lentement, un essentiel à la fois.'
        cta: 'Découvrir l’édition'
        vertical: 'Collection automne · hiver'
    values:
        label: 'Nos engagements'
        craft:
            title: 'Un savoir-faire réfléchi.'
            text: 'Des fibres naturelles, choisies pour bien vieillir.'
        delivery:
            title: 'Une livraison soignée.'
            text: 'Emballé à la main, expédié sous 48 heures.'
        returns:
            title: 'Des retours simples.'
            text: '30 jours pour changer d’avis, gratuitement.'
    promise:
        link: 'Lire notre manifeste'
        label: 'Le manifeste'
        title: 'Moins de pièces, <em>plus d’attention</em>.'
        lead: 'Nous ne suivons pas les saisons, nous les traversons. Chaque pièce Canvas est dessinée pour être portée longtemps, réparée si besoin et transmise un jour. C’est une façon plus lente de s’habiller, et nous la croyons plus juste.'
        notes:
            matter:
                title: 'La matière'
                text: 'Lin, laine, coton biologique : des fibres qui se patinent au lieu de s’user.'
            make:
                title: 'La façon'
                text: 'Des ateliers que nous connaissons par leur nom, en Europe, à petite échelle.'
            time:
                title: 'Le temps'
                text: 'Des coupes intemporelles, pensées pour dix ans plutôt que pour une saison.'
        signature: '— L’atelier Canvas'
        cta: 'Découvrir les pièces'
