name: Split packages

# Splits every package of src/ into its own read-only repository
# (https://github.com/sylius-starter/<package>) with splitsh-lite.
#
# Requires a SPLIT_TOKEN secret: a token allowed to push (contents: write)
# to every package repository.

"on":
    push:
        branches: ["main"]
        tags: ["v*"]
    workflow_dispatch: ~

concurrency:
    group: split-${{ github.ref }}
    cancel-in-progress: false

permissions:
    contents: read

env:
    SPLITSH_VERSION: v2.0.0

jobs:
    packages:
        name: List packages
        runs-on: ubuntu-latest
        outputs:
            packages: ${{ steps.packages.outputs.packages }}
        steps:
            -   uses: actions/checkout@v6

            -   uses: shivammathur/setup-php@v2
                with:
                    php-version: '8.4'
                    coverage: none

            -   id: packages
                run: echo "packages=$(php .github/scripts/monorepo-matrix.php)" >> "$GITHUB_OUTPUT"

    split:
        name: "Split ${{ matrix.package.name }}"
        needs: packages
        if: github.repository == 'sylius-starter/sylius-starter'
        runs-on: ubuntu-latest
        timeout-minutes: 20
        strategy:
            fail-fast: false
            matrix:
                package: ${{ fromJson(needs.packages.outputs.packages) }}
        steps:
            -   uses: actions/checkout@v6
                with:
                    # splitsh-lite needs the whole history
                    fetch-depth: 0
                    persist-credentials: false

            -   uses: shivammathur/setup-php@v2
                with:
                    php-version: '8.4'
                    coverage: none
                    tools: composer, castor

            -   name: Install splitsh-lite
                run: |
                    mkdir -p "$HOME/.local/bin"
                    curl -fsSL "https://github.com/splitsh/lite/releases/download/${SPLITSH_VERSION}/lite_linux_amd64.tar.gz" | tar -xz -C "$HOME/.local/bin"
                    chmod +x "$HOME/.local/bin/splitsh-lite"
                    echo "$HOME/.local/bin" >> "$GITHUB_PATH"

            -   name: Split and push
                env:
                    SPLIT_TOKEN: ${{ secrets.SPLIT_TOKEN }}
                run: |
                    if [ -z "$SPLIT_TOKEN" ]; then
                        echo "::error::The SPLIT_TOKEN secret is not configured."
                        exit 1
                    fi
                    git config --global user.name "github-actions[bot]"
                    git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
                    castor monorepo:split "${{ matrix.package.name }}" \
                        --ref="${GITHUB_REF}" \
                        --push \
                        --remote-pattern="https://x-access-token:${SPLIT_TOKEN}@github.com/{name}.git"
