<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc">
  <title id="title">Select Sylius payment gateways interactively</title>
  <desc id="desc">A terminal showing Castor presenting Mollie, Paypal, and Stripe as a multiselect choice. The user selects Paypal and Stripe.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617" />
      <stop offset="1" stop-color="#172554" />
    </linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#172033" />
      <stop offset="1" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020617" flood-opacity="0.45" />
    </filter>
    <clipPath id="terminal-clip">
      <rect x="24" y="24" width="1232" height="772" rx="20" />
    </clipPath>
  </defs>
  <rect width="1280" height="820" fill="url(#canvas)" />
  <rect x="24" y="24" width="1232" height="772" rx="20" fill="#0f172a" filter="url(#shadow)" />
  <g clip-path="url(#terminal-clip)">
    <rect x="24" y="24" width="1232" height="70" fill="url(#header)" />
    <circle cx="62" cy="59" r="8" fill="#fb7185" />
    <circle cx="90" cy="59" r="8" fill="#fbbf24" />
    <circle cx="118" cy="59" r="8" fill="#4ade80" />
    <text x="640" y="65" fill="#94a3b8" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="17" text-anchor="middle">Payment gateways — interactive setup</text>
    <line x1="24" y1="94" x2="1256" y2="94" stroke="#334155" stroke-width="1" />
    <g font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace">
      <text x="72" y="154" font-size="22">
        <tspan fill="#38bdf8">$</tspan>
        <tspan fill="#e2e8f0"> castor </tspan>
        <tspan fill="#86efac">sylius:payment-gateways:setup</tspan>
      </text>
      <text x="72" y="226" fill="#fbbf24" font-size="20">Which payment gateways would you like to use?</text>
      <text x="72" y="267" font-size="19">
        <tspan fill="#64748b">[0]</tspan>
        <tspan fill="#cbd5e1"> mollie</tspan>
      </text>
      <text x="72" y="301" font-size="19">
        <tspan fill="#4ade80">[1]</tspan>
        <tspan fill="#cbd5e1"> paypal</tspan>
      </text>
      <text x="72" y="335" font-size="19">
        <tspan fill="#4ade80">[2]</tspan>
        <tspan fill="#cbd5e1"> stripe</tspan>
      </text>
      <text x="72" y="389" font-size="20">
        <tspan fill="#38bdf8">&gt; </tspan>
        <tspan fill="#e2e8f0">1,2</tspan>
      </text>
      <line x1="72" y1="438" x2="1208" y2="438" stroke="#1e293b" stroke-width="1" />
      <text x="72" y="492" fill="#fbbf24" font-size="20">Adding Paypal plugin</text>
      <text x="72" y="530" fill="#86efac" font-size="17">&gt; composer require sylius/paypal-plugin</text>
      <text x="72" y="592" fill="#fbbf24" font-size="20">Adding Stripe Plugin</text>
      <text x="72" y="630" fill="#86efac" font-size="17">&gt; composer require flux-se/sylius-stripe-plugin</text>
      <text x="72" y="704" fill="#38bdf8" font-size="20">$</text>
    </g>
  </g>
</svg>
